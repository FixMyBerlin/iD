# Fork-local translations until strings are on Transifex (core resource).
# Merged deeply over the built locale files, so single strings can be overridden.
de:
  traffic_sign_field:
    order_hint: Schilder werden von oben nach unten gelesen. Das oberste Schild ist das Hauptschild.
    open_tool: Im Verkehrszeichen-Tool öffnen
    drag: Zum Umsortieren ziehen oder Pfeiltasten nutzen
    empty: Noch keine Schilder. Unten nach Name oder Zeichen-ID suchen, um eines hinzuzufügen.
    add_sign: Schild hinzufügen…
    unknown_sign: Unbekanntes Schild
    no_sign: Unbeschildert
    no_sign_description: Hier steht explizit kein Verkehrsschild (traffic_sign=none)
  map_display:
    title: Kartendarstellung
    description: Kartendarstellung
  photos_pane:
    title: Fotos
    description: Fotos
  pane_tooltips:
    background: Luftbilder, Helligkeit und Bildversatz.
    map-data: OpenStreetMap-Daten und -Hinweise, QA-Ebenen, eigene Datenebenen, Überlagerungen und Live-Bearbeitungen.
    map-display: Flächenfüllung, Linse und welche Objektarten angezeigt werden.
    photos: Straßenfotos, ihre Filter und die Verkehrszeichen.
    issues: Fehler und Warnungen in deinen Änderungen und in der Karte.
    preferences: Werkzeugleisten-Beschriftung, optionale Schaltflächen, Info-Felder, Datenschutz, Favoriten und OpenStreetMap-Server.
    help: Dokumentation, Einführung, Tastaturkürzel und Version des Editors.
  tilda_notes:
    title: TILDA-Hinweis
    private: "Interner Hinweis: Nur Mitglieder dieser Region in TILDA sehen ihn."
    new: Neuer TILDA-Hinweis
    status:
      open: offen
      closed: erledigt
    replies: "{count} Antworten"
    loading: Hinweis wird geladen …
    not_loaded: Der Hinweis konnte nicht geladen werden.
    no_body: Es wurde nur ein Betreff angegeben.
    subject: Betreff
    body: Hinweis
    body_placeholder: "Beschreibe, was dir aufgefallen ist (Markdown)."
    reply: Antwort
    reply_placeholder: "Schreibe eine Antwort (Markdown)."
    save_explanation: "Wird sofort in TILDA gespeichert, nicht mit deinen OpenStreetMap-Änderungen. Nicht öffentlich."
    save: Hinweis speichern
    save_reply: Antwort speichern
    resolve: Als erledigt markieren
    resolve_reply: Antworten und erledigen
    reopen: Wieder öffnen
    reopen_reply: Antworten und wieder öffnen
    open_in_tilda: In TILDA öffnen
    open_tilda: TILDA öffnen
    add:
      title: TILDA
      osm_title: OSM
      description: "Internen TILDA-Hinweis hinzufügen. Nur Mitglieder des Projekts sehen ihn."
    errors:
      login: "Melde dich bei OpenStreetMap an, um TILDA-Hinweise zu sehen und zu schreiben."
      invalid_osm_token: "OpenStreetMap hat deine Anmeldung nicht akzeptiert. Melde dich neu an."
      no_tilda_user: "Dein OpenStreetMap-Konto hat noch kein TILDA-Konto. Melde dich einmal bei TILDA an."
      not_member: "Du bist in TILDA kein Mitglied dieser Region. Bitte um Zugang."
      network: "TILDA ist nicht erreichbar."
      other: "TILDA: {message}"
  map_data:
    layers:
      notes:
        title: OpenStreetMap-Hinweise (öffentlich)
        tooltip: Öffentliche Hinweise von OpenStreetMap. Jede:r kann sie lesen.
      tilda-notes:
        title: TILDA-Hinweise (intern)
        tooltip: Interne Hinweise des Projekts aus TILDA. Nur Mitglieder der Region sehen sie.
  modes:
    add_note:
      description: "Öffentlichen OpenStreetMap-Hinweis hinzufügen. Jede:r kann ihn lesen."
  account:
    title: Konto
    tooltip: "Angemeldet als {user}"
  way_table:
    title: Wege-Tabelle
    tooltip: Vergleiche die Tags des ausgewählten Wegs mit dem vorherigen und dem nächsten Weg, unter der Karte.
    empty: Wähle einen Weg aus, um seine Tags mit dem vorherigen und dem nächsten Weg zu vergleichen.
    previous: Vorherigen Weg auswählen
    next: Nächsten Weg auswählen
    reversed: Dieser Weg zeigt in die Gegenrichtung. Seine left/right-Tags sind getauscht dargestellt.
    edited: In dieser Sitzung geändert
    junction:
      backward: "Vor dem ersten Weg geht es mit mehreren Wegen weiter. Wähle einen:"
      forward: "Nach dem letzten Weg geht es mit mehreren Wegen weiter. Wähle einen:"
  preferences:
    interface:
      labels:
        description: Beschriftung der Schaltflächen anzeigen
        tooltip: Zeigt die Beschriftung unter den Schaltflächen der Werkzeugleiste.
      scale:
        description: Maßstab anzeigen
        tooltip: Ein Maßstabsbalken unten in der Karte. Ein Klick wechselt zwischen metrischen und imperialen Einheiten.
      zoom:
        description: Zoom-Schaltflächen anzeigen
        tooltip: "Die Schaltflächen + und − am Kartenrand. Die Tastenkürzel + und − funktionieren immer."
      zoom-to-selection:
        description: "„Auf Auswahl zoomen“ anzeigen"
        tooltip: Die Schaltfläche, die auf die ausgewählten Objekte zoomt. Ihr Tastenkürzel funktioniert immer.
      geolocate:
        description: "„Meinen Standort anzeigen“ anzeigen"
        tooltip: Die Schaltfläche, die die Karte auf deinen Standort zentriert.
      help:
        description: Hilfe-Schaltfläche anzeigen
        tooltip: "Die Schaltfläche, die die Hilfe öffnet, mit der Version des Editors und den Links zum Melden von Fehlern. Ihr Tastenkürzel funktioniert immer."
    osm_server:
      title: OpenStreetMap-Server
      live: Live
      dev: Entwicklungsserver
      hint: Von welchem OpenStreetMap-Server der Editor liest und wohin er hochlädt. Beim Wechsel gehen ungespeicherte Änderungen verloren.
    panels:
      title: Info-Felder
  issues:
    cycleway_oneway_wrong:
      title: Richtung der Radspur vermutlich falsch
      tip: "Findet Straßen, bei denen das „oneway“-Tag einer Radspur oder eines Radwegs an der Seite sehr wahrscheinlich die falsche Richtung angibt."
      message: "{feature}: {tag} ist vermutlich falsch"
      two_way_road:
        reference: "„oneway“ bezieht sich auf die Richtung, in der die Linie gezeichnet ist. Auf der linken Seite einer Straße mit Gegenverkehr fährt der Radverkehr gegen diese Richtung; „{tag}“ sagt also, er fährt dem Verkehr neben sich entgegen. Ohne das Tag gilt die übliche Richtung: auf jeder Seite mit dem Verkehr. Entferne das Tag, oder setze „no“, wenn Radfahrende hier in beide Richtungen fahren dürfen."
      contraflow:
        reference: "Radfahrende dürfen diese Einbahnstraße in Gegenrichtung befahren; die linke Seite ist damit die Seite für die Gegenrichtung. „{tag}“ sagt, dort wird in Richtung der Einbahnstraße gefahren. Ohne das Tag gilt die übliche Richtung. Entferne das Tag, oder setze „no“, wenn Radfahrende hier in beide Richtungen fahren dürfen."
    cycleway_oneway_redundant:
      title: Richtung der Radspur nicht nötig
      tip: "Findet Straßen, bei denen das „oneway“-Tag einer Radspur oder eines Radwegs an der Seite nur den Standard wiederholt."
      message: "{feature}: {tag} ist nicht nötig"
      default:
        reference: "Ohne „{key}“ gilt: Der Radverkehr fährt mit dem Verkehr auf seiner Seite. Genau das sagt „{tag}“. Das Tag ist nicht nötig und leicht falsch zu setzen, weil sich „oneway“ auf die Richtung der gezeichneten Linie bezieht."
    fix:
      cycleway_oneway_both_ways:
        title: Radverkehr fährt hier in beide Richtungen
        annotation: Radspur in beide Richtungen eingetragen.
      cycleway_oneway_correct:
        title: Das ist hier richtig
  inspector:
    tilda:
      default:
        generic: "Nicht getaggt = {tag}. Nur taggen, wenn es hier anders ist."
        surface_colour: "Nicht getaggt = nicht eingefärbt. Nur taggen, wenn die Oberfläche rot oder grün ist."
        oneway_bicycle: "Nicht getaggt = Radverkehr folgt der Einbahnstraße. Nur „no“ taggen, wenn er in Gegenrichtung fahren darf."
        oneway_side: "Nicht getaggt = Radverkehr fährt mit dem Verkehr auf dieser Seite. Nur „no“ taggen, wenn er hier in beide Richtungen fahren darf."
        oneway_road: "Nicht getaggt = Straße mit Gegenverkehr."
        dual_carriageway: "Nicht getaggt = keine getrennte Richtungsfahrbahn. „yes“ taggen, wenn die Gegenrichtung eine eigene Linie ist."
      checks:
        check: Geprüft
        check_tooltip: "Bestätige, dass du das angesehen hast und der Standard stimmt. Das wird für das Projekt gespeichert, nicht in OpenStreetMap, und braucht keinen Upload."
        uncheck_tooltip: "Geprüft. Klicken, um die Prüfung zu entfernen."
        checked_by: "Geprüft von {user}, {date}"
        verify: Verifiziert
        verify_tooltip: "Diesen Weg als verifiziert markieren (zweiter Blick durch eine andere Person). Das wird für das Projekt gespeichert, nicht in OpenStreetMap, und braucht keinen Upload."
        unverify_tooltip: "Verifiziert. Klicken, um es zu entfernen."
        verified_by: "Verifiziert von {user}, {date}"
        not_verified: Noch nicht verifiziert
        changed_since: der Weg wurde seitdem geändert
        you: dir
        save_failed: "Die Prüfung konnte nicht gespeichert werden."
        disabled:
          new_way: "Lade den Weg zuerst hoch; eine Prüfung braucht seine OpenStreetMap-ID."
          unavailable: "Prüfungen sind von dieser Adresse aus nicht verfügbar."
          loading: "Prüfungen werden geladen…"
          logged_out: "Melde dich bei OpenStreetMap an, um Prüfungen zu speichern."
    traffic_sign_group:
      label:
        way: Verkehrsschild
        cycleway: Verkehrsschild (Radverkehrsanlage)
        sidewalk: Verkehrsschild (Gehweg)
      side:
        left: Links
        right: Rechts
        both: Beide Seiten
      direction:
        forward: "In Wegrichtung (forward)"
        backward: "Gegen die Wegrichtung (backward)"
        both: "Ganzer Weg (beide Richtungen)"
      toggle:
        directions: Je Richtung
        directions_tooltip: "Schilder ergänzen, die nur in einer Richtung des Wegs gelten („traffic_sign:forward“, „traffic_sign:backward“). Das Schild des ganzen Wegs wird als „traffic_sign“ getaggt, ohne Richtung. Richtungsschilder, die nur das Schild des ganzen Wegs wiederholen, werden als dieses angezeigt; so getaggt werden sie mit deiner nächsten Änderung an diesem Schild."
        directions_locked_tooltip: "Dieser Weg hat Schilder je Richtung („traffic_sign:forward“, „traffic_sign:backward“). Entferne sie, um das auszuschalten."
    hidden_preset:
      manual: "{features} sind versteckt. Schalte sie im Bereich Kartendarstellung ein."
  help:
    streetlevel:
      using: "Um Straßenfotos beim Bearbeiten zu benutzen, öffne den Bereich {photos_icon} **{photos}** am Rand der Karte und schalte dort die verfügbaren Bildquellen ein oder aus."
  shortcuts:
    browsing:
      display_options:
        map_display: "Kartendarstellung ein-/ausblenden"
        photos: "Fotos ein-/ausblenden"
        way_table: "Wege-Tabelle ein-/ausblenden"
