# Radnetz mapping editor (FixMyBerlin/iD): Netlify builds and serves only the branch `radnetz-mapping`.
# Deploy previews and other branch deploys are turned off in the site settings.
[build]
  command = "npm run all"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # OSM login: our own OAuth 2 application, registered under the OSM account "FixMyCity TILDA".
  # iD's default application only allows the addresses of the iD project. The client id is public.
  # Redirect URIs registered there: https://radnetz-mapping.netlify.app/land.html, http://127.0.0.1:8080/land.html
  ID_API_CONNECTION_URL = "https://www.openstreetmap.org"
  ID_API_CONNECTION_API_URL = "https://api.openstreetmap.org"
  ID_API_CONNECTION_CLIENT_ID = "2LA8z5LXv1R-GotmM58SxIu8_YimObI5F4TKrdyuet8"
